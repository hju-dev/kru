<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Battle of Wits</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-bonus.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="/games/shared/kru-quiz.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game qb">
      <header class="bar">
        <span class="round" id="round">Battle of <b>Wits</b></span>
        <span class="qnum" id="qnum"></span>
        <span class="double" id="double" hidden>DOUBLE ×2</span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="q" id="q">Loading…</div>
        <div class="choices" id="choices"></div>
        <div class="short" id="short" hidden>Short answer: write it on your board.</div>
        <div class="short-ans" id="shortAns" hidden></div>
        <div id="say"></div>
      </section>

      <div class="write" id="write" role="status"></div>

      <div class="controls">
        <span class="digits" id="digits">0:20</span>
        <div class="progress"><i id="fill"></i></div>
        <button class="btn" id="go">Start timer</button>
        <button class="btn teal" id="reveal">Reveal</button>
        <button class="btn gold" id="next">Next ▶</button>
      </div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap the teams that were right"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo" hidden>Undo</button>
      </div>
    </main>

    <!-- Choose a question set -->
    <div class="backdrop" id="setsBack" hidden>
      <div class="menu" role="dialog" aria-labelledby="setsTitle">
        <h2 class="round" id="setsTitle">Choose a question set</h2>
        <div class="sets" id="sets"></div>
        <p class="problems" id="problems" hidden></p>
        <button class="btn ghost" id="setsClose" hidden>Cancel</button>
      </div>
    </div>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="Settings">
        <div class="menu-rounds" id="secsRow"></div>
        <button class="btn" id="showNow">Show the answer now</button>
        <button class="btn" id="changeSet">Choose another set</button>
        <button class="btn" id="prev">◀ Previous question</button>
        <button class="btn ghost danger" id="resetScores">Reset all scores</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-bonus.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="/games/shared/kru-quiz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
