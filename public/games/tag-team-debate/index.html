<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Tag-Team Debate</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-bonus.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="/games/tag-team/style.css" />
  </head>
  <body>
    <main class="game tag">
      <header class="bar">
        <span class="logo">Tag-Team <b id="logoMode">Debate</b></span>
        <span class="picks" id="picks"></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="More options">⋯</button>
      </header>

      <section class="topicbox">
        <div class="topic-text">
          <span class="eyebrow" id="topicLabel">Topic</span>
          <div class="topic" id="topic">Loading…</div>
        </div>
        <button class="btn gold" id="spin">Spin</button>
      </section>

      <section class="clockrow" aria-live="polite">
        <span class="digits" id="digits">0:00</span>
        <div class="phasebox">
          <div class="phase" id="phase">Ready</div>
          <div class="sub" id="sub"></div>
        </div>
        <button class="btn gold" id="main">Start huddle</button>
        <button class="btn" id="pause">Pause</button>
        <button class="btn coral" id="challenge">Challenge!</button>
      </section>
      <div class="progress"><i id="fill"></i></div>

      <div class="lane" id="lane" aria-label="Speaking order: tap two names to swap them"></div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap one to give points"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo">Undo</button>
      </div>
      <div class="flash" id="flash" hidden></div>
    </main>

    <!-- Choose a team (team at the front / FOR / AGAINST) -->
    <div class="backdrop" id="chooseBack" hidden>
      <div class="menu" role="dialog" aria-labelledby="chooseTitle">
        <h2 id="chooseTitle">Choose a team</h2>
        <div class="choose" id="chooseList"></div>
        <button class="btn ghost" id="chooseClose">Cancel</button>
      </div>
    </div>

    <!-- Points for one team -->
    <div class="backdrop low" id="panelBack" hidden>
      <div class="menu" role="dialog" aria-labelledby="panelName">
        <div class="panel-head">
          <div>
            <b id="panelName"></b> · <span id="panelPts"></span>
            <div class="panel-members" id="panelMembers"></div>
          </div>
          <button class="small" id="panelClose" aria-label="Close">✕</button>
        </div>
        <div class="panel-btns" id="panelBtns">
          <button class="btn gold" data-d="3" data-why="won the vote">+3 Win</button>
          <button class="btn" data-d="1" data-why="fair challenge">+1 Challenge</button>
          <button class="btn" data-d="-1" data-why="correction">−1</button>
        </div>
      </div>
    </div>

    <!-- ⋯ menu -->
    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="More options">
        <button class="btn" id="resetTimer">Reset the timer</button>
        <button class="btn" id="resetOrder">Reset the speaking order</button>
        <button class="btn" id="undo">Undo last points</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost danger" id="resetScores">Reset all scores</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>


    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-bonus.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="/games/shared/kru-quiz.js"></script>
    <script src="/games/tag-team/app.js"></script>
  </body>
</html>
