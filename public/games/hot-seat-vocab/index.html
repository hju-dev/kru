<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Hot Seat Vocab</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game hs">
      <header class="bar">
        <span class="logo">Hot Seat <b>Vocab</b></span>
        <span class="seat" id="seat"></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.6 4.16 L10.16 1.56 L13.84 1.56 L14.4 4.16 L15.14 4.42 L15.85 4.76 L18.08 3.32 L20.68 5.92 L19.24 8.15 L19.58 8.86 L19.84 9.6 L22.44 10.16 L22.44 13.84 L19.84 14.4 L19.58 15.14 L19.24 15.85 L20.68 18.08 L18.08 20.68 L15.85 19.24 L15.14 19.58 L14.4 19.84 L13.84 22.44 L10.16 22.44 L9.6 19.84 L8.86 19.58 L8.15 19.24 L5.92 20.68 L3.32 18.08 L4.76 15.85 L4.42 15.14 L4.16 14.4 L1.56 13.84 L1.56 10.16 L4.16 9.6 L4.42 8.86 L4.76 8.15 L3.32 5.92 L5.92 3.32 L8.15 4.76 L8.86 4.42 Z M15.6 12a3.6 3.6 0 1 0-7.2 0 3.6 3.6 0 1 0 7.2 0z"/></svg></button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <span class="cat" id="cat" hidden></span>
        <div class="word" id="word"></div>
        <div class="taboo" id="taboo" hidden></div>
        <ul class="meanings" id="meanings" hidden></ul>
        <div class="note" id="note"></div>
      </section>

      <div class="controls">
        <span class="digits" id="digits">1:00</span>
        <div class="progress"><i id="fill"></i></div>
        <button class="btn gold" id="main">Start round</button>
        <button class="btn bat" id="bA" hidden></button>
        <button class="btn bat" id="bB" hidden></button>
        <button class="btn" id="skip" hidden>Skip</button>
      </div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap one to put it in the hot seat"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo">Undo</button>
      </div>
    </main>

    <!-- Tap a team: who is in it, add or take away points, put it in the hot seat -->
    <div class="backdrop" id="teamBack" hidden>
      <div class="menu team-pop" role="dialog" aria-labelledby="teamName">
        <h2 id="teamName"></h2>
        <div class="team-members" id="teamMembers"></div>
        <div class="team-pts">
          <button class="btn" id="ptsMinus" aria-label="Take away 1 point">−1</button>
          <output id="teamPts">0</output>
          <button class="btn gold" id="ptsPlus" aria-label="Add 1 point">+1</button>
        </div>
        <button class="btn teal" id="teamSeat">Put in the hot seat</button>
        <button class="btn ghost" id="teamClose">Close</button>
      </div>
    </div>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="Settings">
        <div class="menu-row" id="secsRow"></div>
        <button class="btn end" id="endRound">End this round now</button>
        <button class="btn" id="skipBattle">Skip the Battle Round</button>
        <button class="btn" id="undo">Undo last word</button>
        <button class="btn ghost danger" id="resetScores">New Game</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-menu.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="/games/shared/kru-picker.js"></script>
    <script src="/games/shared/kru-quiz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
