<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Hot Seat Vocab</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game hs">
      <header class="bar">
        <span class="logo">Hot Seat <b>Vocab</b></span>
        <span class="seat" id="seat"></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="More options">⋯</button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <span class="cat" id="cat" hidden></span>
        <div class="word" id="word"></div>
        <div class="note" id="note"></div>
      </section>

      <div class="controls">
        <span class="digits" id="digits">1:00</span>
        <div class="progress"><i id="fill"></i></div>
        <button class="btn gold" id="main">Start round</button>
        <button class="btn" id="skip" hidden>Skip</button>
      </div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap one to put it in the hot seat"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo">Undo</button>
      </div>
    </main>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="More options">
        <div class="menu-row" id="secsRow"></div>
        <button class="btn" id="endRound">End this round now</button>
        <button class="btn" id="undo">Undo last word</button>
        <button class="btn ghost danger" id="resetScores">Reset all scores</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="app.js"></script>
  </body>
</html>
