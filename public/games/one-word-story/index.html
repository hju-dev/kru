<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>One-Word Story</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-cards.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game kc ows">
      <header class="bar">
        <span class="logo">One-Word <b>Story</b></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="More options">⋯</button>
      </header>

      <section class="stage" id="stage">
        <div class="card">
          <div class="sub" id="label">Story opener</div>
          <div class="big opener" id="opener">Loading…</div>
          <div class="sub counts" id="counts" aria-live="polite"></div>
        </div>
        <div class="flash" id="flash" hidden></div>
      </section>

      <div class="controls">
        <div class="beat" id="beat" aria-hidden="true"><span id="beatNum">5</span></div>
        <div class="clock">
          <span class="digits" id="digits">4:00</span>
          <span class="phase" id="phase">Ready</span>
        </div>
        <span class="grow"></span>
        <button class="btn" id="go">Start story</button>
        <button class="btn coral" id="period">Period!</button>
        <button class="btn teal" id="retell" hidden>Retell 0:30</button>
        <button class="btn gold" id="next">New opener ▶</button>
      </div>
    </main>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="More options">
        <div class="menu-label">Story time</div>
        <div class="menu-row" id="roundRow"></div>
        <div class="menu-label">One word every…</div>
        <div class="menu-row" id="beatRow"></div>
        <div class="menu-row">
          <button class="btn" id="howTo">How to play</button>
          <button class="btn" id="resetStory">Start this story again</button>
        </div>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="app.js"></script>
  </body>
</html>
