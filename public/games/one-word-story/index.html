<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>One-Word Story</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-cards.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game kc ows">
      <header class="bar">
        <span class="logo">One-Word <b>Story</b></span>
        <span class="count" id="count" aria-live="polite"></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="More options">⋯</button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="sub" id="label">Story opener</div>
        <div class="opener" id="opener">Loading…</div>
        <div class="writers" id="writers"></div>
        <div class="judge" id="judge" hidden>
          <div class="sub">Read both stories out loud. Which story is best?</div>
          <div class="judge-btns" id="judgeBtns"></div>
        </div>
      </section>

      <div class="controls">
        <div class="secs" id="secs" aria-hidden="true">5</div>
        <span class="phase" id="phase">Ready</span>
        <span class="grow"></span>
        <button class="btn" id="go">Start</button>
        <button class="btn gold" id="next">Next story ▶</button>
      </div>

      <div class="totals" id="totals" aria-label="Points"></div>
    </main>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="More options">
        <div class="menu-label">Words in the story</div>
        <div class="menu-row" id="wordsRow"></div>
        <div class="menu-label">Time to write one word</div>
        <div class="menu-row" id="writeRow"></div>
        <div class="menu-label">Get-ready time between words</div>
        <div class="menu-row" id="gapRow"></div>
        <div class="menu-row">
          <button class="btn" id="howTo">How to play</button>
          <button class="btn" id="resetStory">Start this story again</button>
        </div>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-picker.js"></script>
    <script src="app.js"></script>
  </body>
</html>
