<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Class Order</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game co">
      <header class="bar">
        <span class="logo">Class <b>Order</b></span>
        <span class="info" id="info"></span>
        <span class="grow"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="now-label">Now</div>
        <div class="now" id="now"></div>
        <div class="deck" id="deck"></div>
      </section>

      <div class="controls">
        <button class="btn ghost" id="back">◀ Back</button>
        <button class="btn ghost" id="absent">Absent: skip</button>
        <span class="grow"></span>
        <button class="btn gold" id="done">Done ▶</button>
      </div>
      <div class="list" id="list" aria-label="The whole class, in order"></div>
    </main>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="Settings">
        <button class="btn" id="byNumber">Start again: by number</button>
        <button class="btn" id="random">Start again: random order</button>
        <p class="muted small">Starting again clears who has had a turn. Kru remembers where you stopped, so the next lesson carries on.</p>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-menu.js"></script>
    <script src="app.js"></script>
  </body>
</html>
