<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Fortress</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="/games/shared/kru-cards.css" />
    <link rel="stylesheet" href="/games/shared/kru-quiz.css" />
    <link rel="stylesheet" href="/games/race-board/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game kc rb ft">
      <header class="bar">
        <span class="logo">⚔ <b>Fortress</b></span>
        <span class="turn" id="turn" aria-live="polite"></span>
        <span class="grow"></span>
        <button class="btn gold" id="act">Question ▶</button>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.6 4.16 L10.16 1.56 L13.84 1.56 L14.4 4.16 L15.14 4.42 L15.85 4.76 L18.08 3.32 L20.68 5.92 L19.24 8.15 L19.58 8.86 L19.84 9.6 L22.44 10.16 L22.44 13.84 L19.84 14.4 L19.58 15.14 L19.24 15.85 L20.68 18.08 L18.08 20.68 L15.85 19.24 L15.14 19.58 L14.4 19.84 L13.84 22.44 L10.16 22.44 L9.6 19.84 L8.86 19.58 L8.15 19.24 L5.92 20.68 L3.32 18.08 L4.76 15.85 L4.42 15.14 L4.16 14.4 L1.56 13.84 L1.56 10.16 L4.16 9.6 L4.42 8.86 L4.76 8.15 L3.32 5.92 L5.92 3.32 L8.15 4.76 L8.86 4.42 Z M15.6 12a3.6 3.6 0 1 0-7.2 0 3.6 3.6 0 1 0 7.2 0z"/></svg></button>
      </header>
      <div class="board" id="board" aria-label="The four bases"></div>
      <div class="tray" id="tray" hidden></div>
      <div class="toast" id="toast" role="status" hidden><span id="toastText"></span></div>
    </main>

    <!-- The question -->
    <div class="backdrop rb-q" id="qBack" hidden>
      <div class="panel qpanel" role="dialog" aria-labelledby="qWho">
        <section class="stage" id="stage" aria-live="polite">
          <div class="qhead"><b id="qWho"></b> <span class="tier" id="qTier"></span> <span id="qTopic"></span></div>
          <div id="qBody"></div>
        </section>
        <div class="powers" id="powers" role="group" aria-label="Power-ups: one of each per team per game"></div>
        <div class="controls">
          <span class="digits" id="digits">0:30</span>
          <button class="btn pausebtn is-paused" id="go" aria-label="Start the timer"></button>
          <button class="btn teal" id="reveal">Reveal</button>
          <button class="btn ghost iconbtn" id="wrong" aria-label="Wrong" hidden>✗</button>
          <button class="btn gold iconbtn" id="right" aria-label="Right" hidden>✓</button>
        </div>
      </div>
    </div>

    <!-- Choose the question deck -->
    <div class="backdrop" id="deckBack" hidden>
      <div class="menu" role="dialog" aria-labelledby="deckTitle">
        <h2 class="round" id="deckTitle">Choose a question deck</h2>
        <div class="decks" id="decks"></div>
        <button class="btn ghost" id="deckClose" hidden>Cancel</button>
      </div>
    </div>

    <!-- One panel for every choice: reward, shop, who to ally with, which building to sacrifice -->
    <div class="backdrop" id="choiceBack" hidden>
      <div class="panel choice-panel" role="dialog" aria-labelledby="choiceTitle">
        <div class="choice-head"><span class="choice-art" id="choiceArt"></span><h2 class="round" id="choiceTitle"></h2></div>
        <div class="choices" id="choices"></div>
        <div class="choice-foot" id="choiceFoot"></div>
      </div>
    </div>

    <!-- The store: one screen in the buying team's color, with the shopping cart filling up -->
    <div class="backdrop shop-back" id="shopBack" hidden>
      <div class="shop" id="shop" role="dialog" aria-labelledby="shopTitle">
        <div class="shop-head"><span id="shopWho" class="shop-who"></span><b id="shopTitle"></b><span class="grow"></span><span id="shopGold" class="shop-gold"></span></div>
        <div class="shop-grid" id="shopGrid"></div>
        <div class="shop-foot">
          <div class="shop-cart" id="shopCart"></div>
          <button class="btn gold" id="shopDone">Done ▶</button>
        </div>
      </div>
    </div>

    <!-- Aiming: after tapping a team, its buildings with what they do; then pick the target -->
    <div class="backdrop shop-back" id="aimBack" hidden>
      <div class="shop aim" id="aim" role="dialog" aria-labelledby="aimTitle">
        <div class="shop-head"><span id="aimWho" class="shop-who"></span><b id="aimTitle"></b><span class="grow"></span><button class="btn ghost" id="aimCancel">Cancel</button></div>
        <div class="aim-note" id="aimNote"></div>
        <div class="aim-grid" id="aimGrid"></div>
      </div>
    </div>

    <!-- Big event banners -->
    <div class="fx" id="fx" hidden role="status" aria-live="assertive">
      <div class="fx-rays"></div>
      <div class="fx-bits" id="fxBits"></div>
      <div class="fx-card">
        <div class="fx-art" id="fxArt"></div>
        <div class="fx-text">
          <div class="fx-title" id="fxTitle"></div>
          <div class="fx-sub" id="fxSub"></div>
        </div>
        <div class="fx-job" id="fxJob"></div>
      </div>
      <div class="fx-tap">tap to continue</div>
    </div>

    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="Settings">
        <div class="menu-trow"><span class="menu-label">Answer time</span><div id="secsRow"></div></div>
        <div class="menu-row">
          <button class="btn" id="deckBtn">Question deck</button>
          <button class="btn" id="skip">Skip to the next step</button>
        </div>
        <div class="menu-row">
          <button class="btn" id="undoMove">Undo last action</button>
          <button class="btn" id="howTo">How to play</button>
        </div>
        <div class="menu-row">
          <button class="btn ghost danger" id="newGame">New Game</button>
        </div>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-menu.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="/games/shared/kru-quiz.js"></script>
    <script src="art.js"></script>
    <script src="app.js"></script>
  </body>
</html>
