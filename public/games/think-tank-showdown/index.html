<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Think Tank Showdown</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-fx.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game tts">
      <header class="bar">
        <span class="round" id="round">Think Tank <b>Showdown</b></span>
        <span class="qnum" id="qnum"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.6 4.16 L10.16 1.56 L13.84 1.56 L14.4 4.16 L15.14 4.42 L15.85 4.76 L18.08 3.32 L20.68 5.92 L19.24 8.15 L19.58 8.86 L19.84 9.6 L22.44 10.16 L22.44 13.84 L19.84 14.4 L19.58 15.14 L19.24 15.85 L20.68 18.08 L18.08 20.68 L15.85 19.24 L15.14 19.58 L14.4 19.84 L13.84 22.44 L10.16 22.44 L9.6 19.84 L8.86 19.58 L8.15 19.24 L5.92 20.68 L3.32 18.08 L4.76 15.85 L4.42 15.14 L4.16 14.4 L1.56 13.84 L1.56 10.16 L4.16 9.6 L4.42 8.86 L4.76 8.15 L3.32 5.92 L5.92 3.32 L8.15 4.76 L8.86 4.42 Z M15.6 12a3.6 3.6 0 1 0-7.2 0 3.6 3.6 0 1 0 7.2 0z"/></svg></button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <p class="rule" id="rule"></p>
        <div class="q" id="q">Loading…</div>
        <div class="key" id="key" hidden>
          <div class="key-head" id="keyHead"></div>
          <ol class="key-list" id="keyList"></ol>
          <div class="key-bonus" id="keyBonus" hidden></div>
        </div>
      </section>

      <div class="controls">
        <span class="digits" id="digits">0:00</span>
        <div class="progress"><i id="fill"></i></div>
        <button class="btn gold" id="bets" hidden>Set bets</button>
        <button class="btn gold" id="show" hidden>Show question</button>
        <button class="btn pausebtn is-paused" id="go" aria-label="Start the timer"></button>
        <button class="btn gold" id="mark" hidden>Mark answers</button>
        <button class="btn teal" id="bonus" hidden>🎁 Secret bonus</button>
        <button class="btn" id="next">Skip ▶</button>
      </div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap one to give points"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo">Undo</button>
      </div>
    </main>

    <!-- Points for one team -->
    <div class="backdrop" id="panelBack" hidden>
      <div class="panel" id="panel" role="dialog" aria-labelledby="panelName">
        <div class="panel-head">
          <div>
            <b id="panelName"></b> · <span id="panelPts"></span>
            <div class="panel-members" id="panelMembers"></div>
          </div>
          <button class="small" id="panelClose" aria-label="Close">✕</button>
        </div>
        <div class="panel-btns" id="panelNormal">
          <button class="btn" data-d="-1">−1</button>
          <button class="btn gold" data-d="1">+1</button>
          <button class="btn gold" data-d="2">+2</button>
          <button class="btn gold" data-d="3">+3</button>
          <button class="btn gold" data-d="5">+5</button>
          <button class="btn gold" data-d="10">+10</button>
        </div>
      </div>
    </div>

    <!-- Final Wager: every team's bet -->
    <div class="backdrop" id="betsBack" hidden>
      <div class="panel wpanel" role="dialog" aria-labelledby="betsTitle">
        <div class="panel-head"><b id="betsTitle">Bets: any of your points, or ALL IN</b><button class="btn gold" id="betsDone">Done</button></div>
        <div class="wlist" id="betList"></div>
      </div>
    </div>

    <!-- Final Wager: right or wrong for every team, then add up -->
    <div class="backdrop" id="marksBack" hidden>
      <div class="panel wpanel" role="dialog" aria-labelledby="marksTitle">
        <div class="panel-head"><b id="marksTitle">Who got it right?</b><button class="small" id="markClose" aria-label="Close">✕</button></div>
        <div class="wlist" id="markList"></div>
        <button class="btn gold wapply" id="markApply">Add up the scores ✓</button>
      </div>
    </div>

    <!-- ⋯ menu -->
    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="Settings">
        <div class="menu-rounds four" id="menuRounds"></div>
        <div class="menu-trow"><span class="menu-label" id="timeLabel">Time per question</span><div class="menu-rounds" id="secsRow"></div></div>
        <button class="btn" id="prev">◀ Previous question</button>
        <button class="btn" id="spare">Use a spare question</button>
        <button class="btn" id="undo">Undo last points</button>
        <button class="btn ghost danger" id="resetScores">New Game</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <!-- doors: close from the outside in with a ? in the middle, then open on the next question -->
    <div class="doors" id="doors" aria-hidden="true"><i class="door l"></i><i class="door r"></i><b class="dq">?</b></div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-menu.js"></script>
    <script src="/games/shared/kru-fx-art.js"></script>
    <script src="/games/shared/kru-fx.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="app.js"></script>
  </body>
</html>
