<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Think Tank Showdown</title>
    <link rel="stylesheet" href="/games/shared/kru-game.css" />
    <link rel="stylesheet" href="/games/shared/kru-intro.css" />
    <link rel="stylesheet" href="/games/shared/kru-bonus.css" />
    <link rel="stylesheet" href="/games/shared/kru-end.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game tts">
      <header class="bar">
        <span class="round" id="round">Think Tank <b>Showdown</b></span>
        <span class="qnum" id="qnum"></span>
        <button class="small" id="more" aria-haspopup="dialog" aria-label="More options">⋯</button>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <p class="rule" id="rule"></p>
        <div class="q" id="q">Loading…</div>
        <div class="ans" id="ans" hidden>
          <div class="a" id="a"></div>
          <div class="why" id="why"></div>
        </div>
      </section>

      <div class="controls">
        <span class="digits" id="digits">0:00</span>
        <div class="progress"><i id="fill"></i></div>
        <button class="btn gold" id="show" hidden>Show question</button>
        <button class="btn" id="go">Start timer</button>
        <button class="btn teal" id="reveal">Reveal</button>
        <button class="btn" id="next">Next ▶</button>
      </div>

      <div class="strip" id="strip" role="group" aria-label="Teams: tap one to give points"></div>
      <div class="toast" id="toast" role="status" hidden>
        <span id="toastText"></span>
        <button class="small" id="toastUndo">Undo</button>
      </div>
    </main>

    <!-- Points for one team -->
    <div class="backdrop" id="panelBack" hidden>
      <div class="panel" id="panel" role="dialog" aria-labelledby="panelName">
        <div class="panel-head">
          <div>
            <b id="panelName"></b> · <span id="panelPts"></span>
            <div class="panel-members" id="panelMembers"></div>
          </div>
          <button class="small" id="panelClose" aria-label="Close">✕</button>
        </div>
        <div class="panel-btns" id="panelNormal">
          <button class="btn" data-d="-1">−1</button>
          <button class="btn gold" data-d="1">+1</button>
          <button class="btn gold" data-d="2">+2</button>
        </div>
        <div class="panel-btns" id="panelWager" hidden>
          <span class="bet">
            Bet
            <button class="btn" id="betDown" aria-label="Bet minus 1">−</button>
            <output id="bet">0</output>
            <button class="btn" id="betUp" aria-label="Bet plus 1">+</button>
          </span>
          <button class="btn teal" id="betWin">✓ Right</button>
          <button class="btn coral" id="betLose">✗ Wrong</button>
        </div>
      </div>
    </div>

    <!-- ⋯ menu -->
    <div class="backdrop" id="menuBack" hidden>
      <div class="menu" role="dialog" aria-label="More options">
        <div class="menu-rounds" id="menuRounds"></div>
        <button class="btn" id="prev">◀ Previous question</button>
        <button class="btn" id="spare">Use a spare question</button>
        <button class="btn" id="undo">Undo last points</button>
        <button class="btn ghost danger" id="resetScores">Reset all scores</button>
        <button class="btn" id="howTo">How to play</button>
        <button class="btn ghost" id="menuClose">Close</button>
      </div>
    </div>

    <script src="/sdk/kru.js"></script>
    <script src="/games/shared/kru-intro.js"></script>
    <script src="/games/shared/kru-bonus.js"></script>
    <script src="/games/shared/kru-end.js"></script>
    <script src="app.js"></script>
  </body>
</html>
