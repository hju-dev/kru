<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle of Readers: board (1 per page)</title>
<link rel="stylesheet" href="board.css" />
</head>
<body class="one">
<main class="sheet">
<section class="board"><div class="head"><div class="title">Battle of Readers<small>Our board: write one answer for each question</small></div><div class="fields"><span>Team <i></i></span><span>Round <i></i></span></div></div><div class="q"><span class="n">1</span><div class="lines"></div><div class="mark" aria-label="Teacher or team marks the answer"><b>✓</b><b>✗</b></div></div><div class="q"><span class="n">2</span><div class="lines"></div><div class="mark" aria-label="Teacher or team marks the answer"><b>✓</b><b>✗</b></div></div><div class="q"><span class="n">3</span><div class="lines"></div><div class="mark" aria-label="Teacher or team marks the answer"><b>✓</b><b>✗</b></div></div><div class="q"><span class="n">4</span><div class="lines"></div><div class="mark" aria-label="Teacher or team marks the answer"><b>✓</b><b>✗</b></div></div><div class="q"><span class="n">5</span><div class="lines"></div><div class="mark" aria-label="Teacher or team marks the answer"><b>✓</b><b>✗</b></div></div><div class="tally"><span class="lab">Tally for your teacher</span><span class="ok">Teacher OK <i></i></span><div class="expr"><span class="box">✓ right answers <i></i> / 5</span><span class="op">+</span><span class="box">bonus points <i></i></span><span class="op">=</span><span class="box total">round total <i></i></span></div></div></section>
<p class="help">Print on A4. Give each team one board for every round.</p>
</main>
</body>
</html>
