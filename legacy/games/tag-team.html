<title>Tag-Team Talk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=Poppins:wght@500;700&display=swap">
<style>
/* Layout: game-show stage. Left = big stage (topic, phase, timer, speaker lane); right = team scoreboard. Stacks on narrow screens. Single dark studio look by choice. */
:root {
  --bg: #17151F; --stage: #221F2E; --panel: #2C2839; --line: #3E3950; --fg: #F6F3EC; --muted: #A49FB5;
  --gold: #FFB703; --coral: #FF6B6B; --teal: #2EC4B6; --violet: #9B7BFF;
  --for: #2EC4B6; --against: #FF6B6B;
  --display: "Bricolage Grotesque", "Poppins", system-ui, sans-serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
.app { min-height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }
header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; }
.logo span { color: var(--gold); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 7px 16px; font: 700 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.stage { background: var(--stage); border: 3px solid var(--line); border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; position: relative; overflow: hidden; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.topic { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4.2vw, 56px); line-height: 1.05; text-wrap: balance; min-height: 2.1em; }
.topic.spin { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 700 16px var(--body); border-radius: 14px; border: 2px solid var(--fg); background: transparent; color: var(--fg); padding: 10px 18px; cursor: pointer; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #17151F; }
.btn.coral { background: var(--coral); border-color: var(--coral); color: #17151F; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .team button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.clock { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
@media (max-width: 600px) { .clock { grid-template-columns: 1fr; } }
.digits { font-family: var(--mono); font-size: clamp(80px, 14vw, 190px); line-height: .9; font-variant-numeric: tabular-nums; }
.phase { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 3vw, 40px); }
.sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
.lane { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); }
.slot { border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; font-weight: 700; font-size: 14px; color: var(--muted); background: var(--panel); }
.slot.done { opacity: .45; }
.slot.now { color: #17151F; background: var(--gold); border-color: var(--gold); transform: translateY(-3px); }
.slot.for.now { background: var(--for); border-color: var(--for); }
.slot.against.now { background: var(--against); border-color: var(--against); }
.slot small { display: block; font-weight: 500; font-size: 11px; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
.flash { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--coral) 88%, transparent); font-family: var(--display); font-weight: 800; font-size: clamp(54px, 11vw, 150px); color: #17151F; letter-spacing: -.02em; }
.flash[hidden] { display: none; }
.flash { pointer-events: none; }
.flash.tag { background: color-mix(in srgb, var(--gold) 90%, transparent); }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.board { background: var(--stage); border: 3px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.team { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; background: var(--panel); border-radius: 14px; padding: 8px 10px; border: 2px solid transparent; }
.team.up { border-color: var(--gold); }
.team b { font-size: 15px; } .team .pts { font-family: var(--mono); font-size: 26px; min-width: 2ch; text-align: right; }
.team button { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--fg); font: 700 18px var(--body); cursor: pointer; }
.help { background: var(--stage); border: 3px solid var(--line); border-radius: 22px; padding: 14px 16px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.help b { color: var(--fg); }
kbd { font-family: var(--mono); background: var(--panel); border-radius: 6px; padding: 1px 6px; color: var(--fg); }
select { font: 600 14px var(--body); background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.matchup { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.matchup label { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 15px; }
.matchup .for { color: var(--for); } .matchup .against { color: var(--against); }
.matchup .vs { font-family: var(--display); font-weight: 800; color: var(--muted); }
.team { grid-template-columns: minmax(0, 1fr) auto; }
.team .tname { min-width: 0; }
.team .tname small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
.team .award { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.team .award button { width: auto; height: auto; padding: 4px 9px; font: 700 13px var(--body); border-radius: 9px; border-width: 1.5px; }
.team .award .win { border-color: var(--gold); color: var(--gold); }
.team.is-for { border-color: var(--for); } .team.is-against { border-color: var(--against); }
.team.lead .pts { color: var(--gold); }
#teams { display: flex; flex-direction: column; gap: 8px; }
.side .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.side .tools .btn { font-size: 14px; padding: 7px 12px; }
.team .short { display: none; }
.lastlog { color: var(--muted); font-size: 12.5px; min-height: 1.3em; }
.slot { overflow: hidden; text-overflow: ellipsis; }
.slot.drag { cursor: grab; touch-action: none; user-select: none; }
.slot.drag:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.slot.dragging { opacity: .5; cursor: grabbing; }
.slot.target { outline: 3px dashed var(--gold); outline-offset: 2px; }
.draghint { color: var(--muted); font-size: 13px; }
.btn.mini { font-size: 13px; padding: 5px 10px; border-width: 1.5px; border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { .slot.now { transform: none; } }
/* Phone held sideways (e.g. iPhone 13 mini, 812 × 375): everything on one screen */
@media (orientation: landscape) and (max-height: 500px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-block: 6px; align-content: start; }
  header { gap: 6px; }
  .logo { font-size: 17px; }
  .row { gap: 5px; }
  .seg button { padding: 4px 8px; font-size: 11.5px; }
  .seg { border-width: 1.5px; }
  header .sub, header label.sub { display: none; }
  select { font-size: 11.5px; padding: 2px 4px; border-width: 1.5px; border-radius: 7px; }
  .stage { padding: 8px 10px; gap: 6px; border-width: 2px; border-radius: 14px; }
  .stage > div > .eyebrow { display: none; }
  .topic { font-size: 15px; min-height: 0; line-height: 1.15; }
  .matchup { gap: 5px; flex-wrap: nowrap; } .matchup label { font-size: 12px; gap: 4px; min-width: 0; } .matchup select { max-width: 112px; } .draghint { display: none; }
  .btn { font-size: 11.5px; padding: 4px 8px; border-width: 1.5px; border-radius: 9px; }
  .btn.mini { font-size: 11px; padding: 3px 7px; }
  .clock { grid-template-columns: auto 1fr; gap: 10px; }
  .digits { font-size: 40px; }
  .phase { font-size: 15px; }
  .clock .sub { font-size: 10.5px; margin-top: 1px; }
  .bar { height: 6px; }
  .lane { gap: 4px; }
  .slot { font-size: 10.5px; padding: 3px 2px; border-width: 1.5px; border-radius: 7px; white-space: nowrap; }
  .slot small { font-size: 8.5px; }
  .slot.now { transform: none; }
  .flash { font-size: 48px; }
  .side { gap: 6px; }
  .board { padding: 6px; gap: 4px; border-width: 2px; border-radius: 14px; }
  .board .eyebrow { font-size: 9px; }
  #teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 6px; }
  .side .tools { justify-content: flex-start; }
  .team { grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; padding: 2px 6px; border-radius: 8px; border-width: 1.5px; }
  .team .tname b { font-size: 11.5px; white-space: nowrap; }
  .team .tname small { display: none; }
  .team .pts { font-size: 15px; order: 3; min-width: 2ch; }
  .team .award { grid-column: auto; gap: 3px; flex-wrap: nowrap; justify-self: end; }
  .team .full { display: none; } .team .short { display: inline; }
  .team .award button { font-size: 10px; padding: 1px 5px; border-radius: 6px; }
  .lastlog { font-size: 10px; min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .tools { gap: 4px; } .side .tools .btn { font-size: 10.5px; padding: 3px 7px; }
  .help { display: none; }
}
</style>

<div class="app">
  <header>
    <div class="logo" id="logo">Tag-Team <span>Talk</span></div>
    <div class="row">
      <div class="seg" role="group" aria-label="Level">
        <button id="lv-m2" aria-pressed="true">M.2 · Relay</button>
        <button id="lv-m3" aria-pressed="false">M.3 · Debate</button>
      </div>
      <div class="seg" role="group" aria-label="Class roster">
        <button id="cl-none" aria-pressed="true">No roster</button>
        <button id="cl-32" aria-pressed="false">M.3/2</button>
        <button id="cl-33" aria-pressed="false">M.3/3</button>
      </div>
      <label class="sub" for="size">Speakers per team</label>
      <select id="size"><option>4</option><option selected>5</option><option>6</option></select>
    </div>
  </header>

  <section class="stage" aria-live="polite">
    <div>
      <div class="eyebrow" id="topicLabel">Topic</div>
      <div class="topic" id="topic">Press Spin to choose a topic</div>
    </div>
    <div class="matchup" id="matchup" hidden>
      <label class="for" for="forTeam">FOR <select id="forTeam"></select></label>
      <span class="vs">vs</span>
      <label class="against" for="againstTeam">AGAINST <select id="againstTeam"></select></label>
      <span class="draghint">Drag names below to pick the opener and closer.</span>
      <button class="btn mini" id="resetOrder">Reset order</button>
    </div>
    <div class="row">
      <button class="btn gold" id="spin">Spin topic</button>
      <button class="btn" id="huddle">Start huddle</button>
      <button class="btn" id="go">Start talking</button>
      <button class="btn" id="pause">Pause</button>
      <button class="btn coral" id="challenge">Challenge!</button>
      <button class="btn" id="next">Next speaker</button>
      <button class="btn" id="reset">Reset</button>
    </div>
    <div class="clock">
      <div class="digits" id="digits">0:25</div>
      <div>
        <div class="phase" id="phase">Ready</div>
        <div class="sub" id="sub">Spin a topic, huddle, then talk. A chime means TAG: the next speaker continues.</div>
      </div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="lane" id="lane"></div>
    <div class="flash" id="flash" hidden></div>
  </section>

  <aside class="side">
    <div class="board">
      <div class="eyebrow" id="boardLabel">Scoreboard</div>
      <div id="teams"></div>
      <div class="lastlog" id="lastlog" role="status"></div>
      <div class="tools">
        <button class="btn" id="undo" disabled>Undo last</button>
        <button class="btn" id="clear">Reset scores</button>
      </div>
    </div>
    <div class="help" id="help"></div>
  </aside>
</div>

<script>
const TOPICS = {
  m2: ["If our school had a robot teacher", "The perfect school day", "A day in the life of a school bag", "How to be a good friend",
    "The best superpower for students", "Why mornings are so hard", "My dream canteen menu", "How to survive exam week",
    "If animals could talk", "The best place to visit in Thailand", "The most useful invention ever", "Why everyone should learn to cook",
    "Life on Mars", "The perfect weekend", "What makes a good teacher", "Rainy season: love it or hate it?",
    "How to become famous on the internet", "A new holiday everyone should have", "The best street food", "If I was invisible for a day"],
  m3: ["Homework should be banned.", "Students should be allowed to use phones in class.", "School uniforms should be optional.",
    "It's better to live in the city than the countryside.", "Video games are good for teenagers.", "Every student should learn to cook at school.",
    "School should start at 10 a.m.", "Social media does more harm than good.", "Money can buy happiness.", "Cats are better than dogs.",
    "Robots will make the world a better place.", "Exams are the best way to test students.", "Everyone should play a sport at school.",
    "Fast food should not be sold near schools.", "It's better to be famous than rich."]
};
const CFG = {
  m2: { huddle: 30, turn: 25, label: "Topic", help: `<b>M.2 Relay.</b> One team at the front. <b>Huddle 0:30</b>, then each speaker talks for <b>0:25</b>. At the chime: TAG! The next speaker continues the same talk. Last speaker finishes it.<br><br><b>Challenge!</b> The audience can challenge for: 3-second silence · repeating an idea · off topic · Thai. A fair challenge = +1 to the challenging team.<br><br>Keys: <kbd>Space</kbd> start/pause · <kbd>N</kbd> next · <kbd>C</kbd> challenge · <kbd>S</kbd> spin` },
  m3: { huddle: 90, turn: 30, label: "Motion", help: `<b>M.3 Debate.</b> Two teams at the front: FOR vs AGAINST. <b>Huddle 1:30</b>, then speakers alternate for <b>0:30</b> each, starting with FOR. Every speaker must answer the last point first ("I disagree because…").<br><br><b>Challenge!</b> 3-second silence · repeating · off topic · Thai = +1 to the challenging team. Audience votes for the winning side: +3.<br><br>Keys: <kbd>Space</kbd> start/pause · <kbd>N</kbd> next · <kbd>C</kbd> challenge · <kbd>S</kbd> spin` },
};
const $ = (id) => document.getElementById(id);
let lv = "m2", size = 5, used = { m2: [], m3: [] }, state = "ready", total = 25, left = 25, turn = 0, running = false, last = 0, raf = 0, ac = null;
// Sample rosters only (real rosters come from the Google Sheet via the Kru SDK)
const ROSTERS = {
  "32": { label: "M.3/2", teams: [["T. Henry"], ["S1", "S2", "S3", "S4", "S5"], ["S6", "S7", "S8", "S9", "S10"], ["S11", "S12", "S13", "S14", "S15"], ["S16", "S17", "S18", "S19", "S20"], ["S21", "S22", "S23", "S24", "S25"], ["S26", "S27", "S28", "S29", "S30"]] },
  "33": { label: "M.3/3", teams: [["T. Henry"], ["S1", "S2", "S3", "S4", "S5"], ["S6", "S7", "S8", "S9", "S10"], ["S11", "S12", "S13", "S14", "S15"], ["S16", "S17", "S18", "S19", "S20"], ["S21", "S22", "S23", "S24", "S25"], ["S26", "S27", "S28", "S29", "S30"]] },
};
let cls = "none", match = { "32": [1, 2], "33": [1, 2] }, order = { "32": {}, "33": {} };
let book = { none: { scores: [0, 0, 0, 0, 0, 0], log: [] }, "32": { scores: [0, 0, 0, 0, 0, 0, 0], log: [] }, "33": { scores: [0, 0, 0, 0, 0, 0, 0], log: [] } };
try {
  const s = JSON.parse(localStorage.getItem("ttt2") || "null");
  if (s && s.book) {
    book = Object.assign(book, s.book); cls = s.cls || "none"; match = Object.assign(match, s.match || {}); order = Object.assign(order, s.order || {});
    if (!s.v) ["32", "33"].forEach((c) => { // add Team 0 (T. Henry) to older saved data
      if (book[c].scores.length === 6) { book[c].scores.unshift(0); book[c].log.forEach((L) => L.t++); }
      if (s.match && s.match[c]) match[c] = s.match[c].map((x) => x + 1);
    });
  }
  else { const old = JSON.parse(localStorage.getItem("ttt") || "null"); if (old && old.scores) book.none.scores = old.scores; }
} catch (e) {}
const cur = () => book[cls];
const roster = () => ROSTERS[cls] || null;
const teamName = (i) => roster() ? `Team ${i}` : `Team ${i + 1}`;
function getOrder(t) { const R = roster(), base = R.teams[t], o = order[cls][t]; return o && o.length === base.length && o.every((n) => base.includes(n)) ? o : base.slice(); }

function tone(freqs, gap = 0.18, dur = 0.3, vol = 0.35) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * gap;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    });
  } catch (e) {}
}
const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const turns = () => lv === "m2" ? size : size * 2;
function slotLabel(i) {
  if (lv === "m2") return [`Speaker ${i + 1}`, i === 0 ? "start" : i === size - 1 ? "finish" : "continue"];
  const side = i % 2 === 0 ? "FOR" : "AGAINST", k = Math.floor(i / 2), role = i < 2 ? "opening" : i >= turns() - 2 ? "closing" : "reply";
  const R = roster();
  if (R) {
    const members = getOrder(match[cls][i % 2]), name = members.length === 1 ? members[0] : members[k];
    return [name || `${side}: extra turn`, name ? `${side} · ${role}` : "strongest speaker"];
  }
  return [`${side} ${k + 1}`, role];
}
function buildLane() {
  const n = turns(), lane = $("lane");
  lane.style.setProperty("--n", size);
  lane.innerHTML = Array.from({ length: n }, (_, i) => {
    const [a, b] = slotLabel(i);
    const sideCls = lv === "m3" ? (i % 2 === 0 ? "for" : "against") : "";
    const pos = lv === "m3" ? ` style="grid-row:${(i % 2) + 1};grid-column:${Math.floor(i / 2) + 1}"` : "";
    const R = roster(), k = Math.floor(i / 2), team = R && lv === "m3" ? match[cls][i % 2] : -1;
    const canDrag = team >= 0 && R.teams[team].length > 1 && k < R.teams[team].length;
    const dragAttr = canDrag ? ` data-side="${i % 2}" data-k="${k}" tabindex="0" aria-label="${a}, speaker ${k + 1}. Drag, or use arrow keys, to change the order"` : "";
    return `<div class="slot ${sideCls}${canDrag ? " drag" : ""}" id="slot-${i}"${pos}${dragAttr}>${a}<small>${b}</small></div>`;
  }).join("");
}
function paintLane() {
  for (let i = 0; i < turns(); i++) {
    const el = $("slot-" + i); if (!el) continue;
    el.classList.toggle("now", state === "talk" && i === turn);
    el.classList.toggle("done", state === "talk" ? i < turn : state === "done");
  }
}
function render() {
  $("digits").textContent = fmt(left);
  $("fill").style.transform = `scaleX(${total ? left / total : 0})`;
  $("fill").style.background = left <= 5 && running ? "var(--coral)" : (lv === "m3" && state === "talk" ? (turn % 2 ? "var(--against)" : "var(--for)") : "var(--gold)");
  const P = { ready: ["Ready", "Spin a topic, then start the huddle."], huddle: ["Huddle!", lv === "m2" ? "Plan who says what. Speaker 1 starts, the last speaker finishes." : "FOR team and AGAINST team: plan your points and your replies."],
    talk: [slotLabel(turn)[0] + " is talking", lv === "m2" ? "Keep talking until the chime. Then TAG!" : "Answer the last point first, then add a new one."], done: ["Time's up!", "Audience: any challenges? Give points, then the next team."] };
  $("phase").textContent = P[state][0]; $("sub").textContent = P[state][1];
  $("pause").textContent = running ? "Pause" : "Resume";
  $("pause").disabled = state === "ready" || state === "done";
  $("next").disabled = state !== "talk";
  paintLane();
}
function flash(text, cls = "", ms = 900) {
  const f = $("flash"); f.textContent = text; f.className = "flash " + cls; f.hidden = false;
  clearTimeout(flash.t); flash.t = setTimeout(() => f.hidden = true, ms);
}
function loop(now) {
  if (!running) return;
  left -= (now - last) / 1000; last = now;
  if (left <= 0) {
    if (state === "huddle") { tone([523, 659, 784]); startTalk(); return; }
    if (state === "talk") {
      if (turn + 1 < turns()) { turn++; total = left = CFG[lv].turn; tone([880, 1175], 0.12, 0.22); flash("TAG!", "tag", 700); }
      else { left = 0; running = false; state = "done"; tone([784, 659, 523, 392], 0.2, 0.35); render(); return; }
    }
  }
  render(); raf = requestAnimationFrame(loop);
}
function run() { running = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); render(); }
function startHuddle() { state = "huddle"; total = left = CFG[lv].huddle; turn = 0; run(); }
function startTalk() { state = "talk"; turn = 0; total = left = CFG[lv].turn; tone([660, 880], 0.12); run(); }
function pause() { running = false; cancelAnimationFrame(raf); render(); }
function resetAll() { pause(); state = "ready"; turn = 0; total = left = CFG[lv].turn; render(); }
function spin() {
  const list = TOPICS[lv]; let pool = list.filter((t) => !used[lv].includes(t)); if (!pool.length) { used[lv] = []; pool = list.slice(); }
  const pick = pool[Math.floor(Math.random() * pool.length)]; used[lv].push(pick);
  const el = $("topic"); el.classList.add("spin"); let k = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = pick; el.classList.remove("spin"); tone([988], 0, 0.25); return; }
  const iv = setInterval(() => { el.textContent = list[Math.floor(Math.random() * list.length)]; tone([300 + k * 25], 0, 0.05, 0.12); if (++k > 14) { clearInterval(iv); el.textContent = pick; el.classList.remove("spin"); tone([988, 1319], 0.1, 0.3); } }, 70);
  resetAll();
}
function setLevel(l) {
  lv = l; $("lv-m2").setAttribute("aria-pressed", String(l === "m2")); $("lv-m3").setAttribute("aria-pressed", String(l === "m3"));
  $("logo").innerHTML = l === "m2" ? "Tag-Team <span>Talk</span>" : "Tag-Team <span>Debate</span>";
  $("topicLabel").textContent = CFG[l].label; $("topic").textContent = "Press Spin to choose a " + CFG[l].label.toLowerCase();
  $("help").innerHTML = CFG[l].help; fillMatch(); fitSize(); buildLane(); resetAll(); if ($("teams").childElementCount) teams();
}
function teams() {
  const B = cur(), R = roster(), max = Math.max(...B.scores), m3 = lv === "m3";
  $("boardLabel").textContent = R ? `Scoreboard · ${R.label}` : "Scoreboard";
  $("teams").innerHTML = B.scores.map((s, i) => {
    const side = R && m3 ? (match[cls][0] === i ? " is-for" : match[cls][1] === i ? " is-against" : "") : "";
    const names = R ? `<small>${R.teams[i].join(", ")}</small>` : "";
    return `<div class="team${side}${s === max && max > 0 ? " lead" : ""}" id="team-${i}">
      <div class="tname"><b>${teamName(i)}</b>${names}</div><span class="pts" id="pts-${i}">${s}</span>
      <div class="award">
        <button class="win" id="win-${i}" aria-label="${teamName(i)} won the vote, plus 3">+3 Win</button>
        <button id="chal-${i}" aria-label="${teamName(i)} fair challenge, plus 1">+1 <span class="full">Challenge</span><span class="short">Chal.</span></button>
        <button id="minus-${i}" aria-label="${teamName(i)} minus 1">−1</button>
      </div></div>`;
  }).join("");
  B.scores.forEach((_, i) => {
    $("win-" + i).onclick = () => bump(i, 3, "won the vote");
    $("chal-" + i).onclick = () => bump(i, 1, "fair challenge");
    $("minus-" + i).onclick = () => bump(i, -1, "correction");
  });
  $("undo").disabled = !B.log.length;
  const L = B.log[B.log.length - 1];
  $("lastlog").textContent = L ? `Last: ${teamName(L.t)} ${L.d > 0 ? "+" : ""}${L.d} (${L.why})` : "";
}
function bump(i, d, why) {
  const B = cur(); const before = B.scores[i]; B.scores[i] = Math.max(0, before + d);
  B.log.push({ t: i, d: B.scores[i] - before, why }); if (B.log.length > 200) B.log.shift();
  save(); teams();
}
function undo() { const B = cur(), L = B.log.pop(); if (!L) return; B.scores[L.t] = Math.max(0, B.scores[L.t] - L.d); save(); teams(); }
function save() { try { localStorage.setItem("ttt2", JSON.stringify({ book, cls, match, order, v: 2 })); } catch (e) {} }
function moveSpeaker(side, from, to) {
  const t = match[cls][side], o = getOrder(t);
  if (to < 0 || to >= o.length || from === to) return;
  const [n] = o.splice(from, 1); o.splice(to, 0, n); order[cls][t] = o; save(); buildLane(); paintLane();
}
// drag to reorder (pointer events so it works with a mouse, a touch screen or a smartboard pen)
let drag = null;
$("lane").addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".slot.drag"); if (!el || state === "talk") return;
  drag = { side: +el.dataset.side, k: +el.dataset.k, el, over: null }; el.classList.add("dragging");
  $("lane").setPointerCapture(e.pointerId); e.preventDefault();
});
$("lane").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY), el = t && t.closest(".slot.drag");
  if (drag.over && drag.over !== el) drag.over.classList.remove("target");
  if (el && el !== drag.el && +el.dataset.side === drag.side) { el.classList.add("target"); drag.over = el; } else drag.over = null;
});
function endDrag() {
  if (!drag) return; const d = drag; drag = null; d.el.classList.remove("dragging");
  if (d.over) { d.over.classList.remove("target"); moveSpeaker(d.side, d.k, +d.over.dataset.k); }
}
$("lane").addEventListener("pointerup", endDrag);
$("lane").addEventListener("pointercancel", () => { if (drag) { drag.el.classList.remove("dragging"); if (drag.over) drag.over.classList.remove("target"); drag = null; } });
$("lane").addEventListener("keydown", (e) => {
  const el = e.target.closest(".slot.drag"); if (!el || state === "talk") return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return; e.preventDefault();
  const side = +el.dataset.side, k = +el.dataset.k, to = k + (e.key === "ArrowRight" ? 1 : -1);
  moveSpeaker(side, k, to); const again = $("lane").querySelector(`.slot.drag[data-side="${side}"][data-k="${Math.max(0, Math.min(to, getOrder(match[cls][side]).length - 1))}"]`); if (again) again.focus();
});
function fillMatch() {
  const R = roster(); $("matchup").hidden = !(R && lv === "m3"); if (!R) return;
  const opts = R.teams.map((m, i) => `<option value="${i}">${teamName(i)}${i === 0 ? " · T. Henry" : ""}</option>`).join("");
  $("forTeam").innerHTML = opts; $("againstTeam").innerHTML = opts;
  $("forTeam").value = String(match[cls][0]); $("againstTeam").value = String(match[cls][1]);
}
function fitSize() {
  const R = roster(); if (!R || lv !== "m3") return;
  const n = Math.max(R.teams[match[cls][0]].length, R.teams[match[cls][1]].length);
  size = Math.min(6, Math.max(4, n)); $("size").value = String(size);
}
function setClass(c) {
  cls = c; ["none", "32", "33"].forEach((k) => $("cl-" + k).setAttribute("aria-pressed", String(k === c)));
  if (c !== "none" && lv !== "m3") { setLevel("m3"); }
  fillMatch(); fitSize(); buildLane(); resetAll(); teams(); save();
}
function setMatch() {
  let f = +$("forTeam").value, a = +$("againstTeam").value;
  if (f === a) { a = (f + 1) % roster().teams.length; $("againstTeam").value = String(a); }
  match[cls] = [f, a]; fitSize(); buildLane(); resetAll(); teams(); save();
}

$("lv-m2").onclick = () => setLevel("m2"); $("lv-m3").onclick = () => setLevel("m3");
$("size").onchange = (e) => { size = +e.target.value; buildLane(); resetAll(); };
$("spin").onclick = spin; $("huddle").onclick = startHuddle; $("go").onclick = startTalk;
$("pause").onclick = () => running ? pause() : run();
$("challenge").onclick = () => { if (running) pause(); tone([220, 196], 0.15, 0.3, 0.4); flash("CHALLENGE!", "", 1400); };
$("next").onclick = () => { if (state !== "talk") return; if (turn + 1 < turns()) { turn++; total = left = CFG[lv].turn; tone([880, 1175], 0.12, 0.22); flash("TAG!", "tag", 600); if (!running) render(); } else { pause(); state = "done"; render(); } };
$("reset").onclick = resetAll;
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); if (state === "ready") startHuddle(); else if (state === "done") resetAll(); else running ? pause() : run(); }
  else if (k === "n") $("next").click(); else if (k === "c") $("challenge").click(); else if (k === "s") spin();
});
["none", "32", "33"].forEach((k) => $("cl-" + k).onclick = () => setClass(k));
$("forTeam").onchange = setMatch; $("againstTeam").onchange = setMatch;
$("resetOrder").onclick = () => { match[cls].forEach((t) => delete order[cls][t]); save(); buildLane(); paintLane(); };
$("undo").onclick = undo;
let armed = false;
$("clear").onclick = () => {
  if (!armed) { armed = true; $("clear").textContent = "Click again to reset"; setTimeout(() => { armed = false; $("clear").textContent = "Reset scores"; }, 3000); return; }
  armed = false; $("clear").textContent = "Reset scores"; const B = cur(); B.scores = B.scores.map(() => 0); B.log = []; save(); teams();
};
setLevel(cls === "none" ? "m2" : "m3"); setClass(cls);
</script>
