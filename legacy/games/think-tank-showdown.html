<title>Think Tank Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=Poppins:wght@500;700&display=swap">
<style>
/* Layout: projector game-show board. Left = stage (round, question, timer, answer). Right = 6-team scoreboard. Stacks on narrow screens. Single dark studio look by choice. */
:root {
  --bg: #15171F; --stage: #1F2230; --panel: #292D3D; --line: #3A3F55; --fg: #F6F3EC; --muted: #A3A8BC;
  --gold: #FFB703; --coral: #FF6B6B; --teal: #2EC4B6; --violet: #9B7BFF; --lime: #A7D129; --sky: #4CC9F0;
  --display: "Bricolage Grotesque", "Poppins", system-ui, sans-serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
.app { min-height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; align-content: start;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }
header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; }
.logo span { color: var(--gold); }
.rounds { display: flex; gap: 6px; flex-wrap: wrap; }
.rounds button { background: transparent; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font: 700 14px var(--body); cursor: pointer; }
.rounds button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stage { background: var(--stage); border: 3px solid var(--line); border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; position: relative; overflow: hidden; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rname { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.8vw, 34px); }
.rname b { color: var(--gold); }
.rule { color: var(--muted); font-size: 15px; }
.qnum { font-family: var(--mono); color: var(--muted); font-size: 16px; }
.spare { color: var(--coral); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.q { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 3.9vw, 54px); line-height: 1.1; text-wrap: balance; min-height: 3.3em; display: flex; align-items: center; }
.q.hide { color: var(--muted); }
.clock { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.digits { font-family: var(--mono); font-size: clamp(56px, 8vw, 110px); line-height: .9; font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.digits.warn { color: var(--gold); } .digits.done { color: var(--coral); }
.bar { flex: 1; min-width: 160px; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); transform-origin: left; transition: transform .25s linear; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 700 16px var(--body); border-radius: 14px; border: 2px solid var(--fg); background: transparent; color: var(--fg); padding: 10px 18px; cursor: pointer; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #15171F; }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #15171F; }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.ans { border: 3px dashed var(--line); border-radius: 18px; padding: 14px 18px; min-height: 60px; }
.ans .lab { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ans .a { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.8vw, 36px); color: var(--teal); margin-top: 4px; }
.ans .why { font-size: 16px; margin-top: 4px; color: var(--fg); }
.ans.shut .a, .ans.shut .why { display: none; }
.ans.shut::after { content: "Answer hidden"; color: var(--muted); font-size: 15px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.board { background: var(--stage); border: 3px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.board h2 { margin: 0 0 2px; font-family: var(--display); font-size: 20px; }
.team { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel); border-radius: 14px; padding: 8px 10px; }
.team .dot { width: 10px; height: 38px; border-radius: 6px; }
.team input.name { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--fg); font: 700 15px var(--body); padding: 2px 0; }
.team .pts { font-family: var(--mono); font-size: 30px; text-align: right; min-width: 2ch; }
.team .ctl { grid-column: 2 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
.team .ctl button { font: 700 13px var(--body); border-radius: 9px; border: 1.5px solid var(--line); background: var(--stage); color: var(--fg); padding: 4px 9px; cursor: pointer; }
.team .ctl input { width: 46px; background: var(--stage); color: var(--fg); border: 1.5px solid var(--gold); border-radius: 9px; font: 700 13px var(--mono); padding: 4px 6px; }
.team.lead { outline: 3px solid var(--gold); }
.wagerhint { color: var(--gold); font-size: 13px; }
.small { color: var(--muted); font-size: 12px; }
.reset { align-self: flex-start; }
</style>

<div class="app">
  <header>
    <div class="logo">Think Tank <span>Showdown</span></div>
    <div class="rounds" id="rounds" role="group" aria-label="Round"></div>
  </header>

  <section class="stage" aria-live="polite">
    <div class="top">
      <div>
        <div class="rname" id="rname"></div>
        <div class="rule" id="rule"></div>
      </div>
      <div style="text-align:right"><div class="qnum" id="qnum"></div><div class="spare" id="spare"></div></div>
    </div>
    <div class="q" id="q"></div>
    <div class="clock">
      <div class="digits" id="digits">0:40</div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="row">
      <button class="btn gold" id="show">Show question</button>
      <button class="btn" id="go">Start timer</button>
      <button class="btn teal" id="reveal">Reveal answer</button>
      <button class="btn" id="prev">◀ Back</button>
      <button class="btn" id="next">Next ▶</button>
      <button class="btn" id="sparebtn">Use a spare</button>
    </div>
    <div class="ans shut" id="ans"><div class="lab" id="alab">Answer</div><div class="a" id="a"></div><div class="why" id="why"></div></div>
  </section>

  <aside class="side">
    <div class="board">
      <h2>Scoreboard</h2>
      <div class="wagerhint" id="wagerhint" hidden>Final Wager: type each team's bet (0–5, no more than their score), then ✓ right or ✗ wrong.</div>
      <div id="teams"></div>
      <div class="small">Click a team name to rename it.</div>
      <button class="btn reset" id="reset">Reset scores</button>
    </div>
  </aside>
</div>

<script>
const ROUNDS = [
  { name: "Riddle Rush", tag: "Round 1", secs: 40, rule: "40 seconds. Write ONE answer. Hold it up on \"Show me!\" · 1 point", qs: [
    ["What has keys but can't open locks?", "A piano", "Also accept: a keyboard / a computer keyboard."],
    ["The more you take, the more you leave behind. What are they?", "Footsteps", "Every step you take leaves a footprint behind you."],
    ["What comes once in a minute, twice in a moment, but never in a thousand years?", "The letter M", "Look at the spelling: minute, moMent, thousand years."],
    ["Before Mount Everest was discovered, what was the highest mountain in the world?", "Mount Everest", "It was still the highest. People just didn't know yet!"],
    ["What can you catch but not throw?", "A cold", "Spare question. Also accept: a cough / the flu.", true],
    ["What gets wetter the more it dries?", "A towel", "Spare question.", true],
  ]},
  { name: "Spot the Problem", tag: "Round 2", secs: 45, rule: "45 s to discuss. Hands up to answer. A NEW speaker each time · Right = 2 · Steal = 1", qs: [
    ["\"I wore my red socks and passed my maths test. So red socks help you pass tests.\"", "Two things happened together, but one didn't cause the other.",
      "Award 2 for: coincidence / no proof the socks did it / she passed because she studied."],
    ["\"All five of my friends love K-pop. So every teenager in Thailand loves K-pop.\"", "Five people are too few to say something about everyone.",
      "Award 2 for: small group / you can't generalise / your friends are similar to you."],
    ["\"A famous footballer drinks this energy drink. So it must make you run faster.\"", "The footballer is paid to say it. He was fast before the drink.",
      "Award 2 for: advertising / he's paid / no evidence about the drink itself."],
    ["\"Nobody has proved that ghosts are NOT real. So ghosts must be real.\"", "No proof against something isn't proof for it.",
      "Spare question. Award 2 for: the person saying 'ghosts are real' needs the evidence.", true],
    ["\"You either love this school or you hate it.\"", "There are more than two choices.",
      "Spare question. Award 2 for: you can like some parts and not others / it's in the middle.", true],
  ]},
  { name: "What Would Happen If…?", tag: "Round 3", secs: 90, rule: "90 s: list as many results as you can. Then each team says one NEW idea · 1 point each, 2 times round", qs: [
    ["What would happen if school started at 11 a.m.?", "Example ideas", "Students sleep more · school finishes later · more traffic in the evening · parents need childcare in the morning · less time for homework or sport."],
    ["What would happen if nobody could tell a lie for one whole day?", "Example ideas", "Spare. Friendships break · honest reviews · surprise parties fail · politicians in trouble · fewer arguments later?", true],
    ["What would happen if every phone stopped working for one week?", "Example ideas", "Spare. People talk face to face · get lost (no maps) · banks and shops have problems · less screen time · emergencies are harder.", true],
  ]},
  { name: "Final Wager", tag: "Round 4", secs: 60, rule: "BEFORE you see it: write your bet (0–5 points). Right = win your bet · Wrong = lose it", wager: true, qs: [
    ["A girl has as many brothers as sisters. Each brother has only half as many brothers as sisters. How many brothers and sisters are in the family?", "4 sisters and 3 brothers",
      "The girl sees 3 other sisters and 3 brothers. A brother sees 2 brothers and 4 sisters (2 is half of 4)."],
    ["How many times can you take 10 away from 100?", "Once", "Spare question. After that, you are taking 10 away from 90!", true],
  ]},
];
const TEAMS = [["Team 1", "#FFB703"], ["Team 2", "#FF6B6B"], ["Team 3", "#2EC4B6"], ["Team 4", "#A7D129"], ["Team 5", "#9B7BFF"], ["Team 6", "#4CC9F0"]];
const $ = (id) => document.getElementById(id);
let r = 0, qi = 0, shown = false, left = 0, total = 0, running = false, last = 0, raf = 0, audio = null;
let state = { names: TEAMS.map((t) => t[0]), pts: [0, 0, 0, 0, 0, 0], wager: [0, 0, 0, 0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem("ttshow")); if (s && s.pts && s.pts.length === 6) state = Object.assign(state, s); } catch (e) {}
const persist = () => { try { localStorage.setItem("ttshow", JSON.stringify(state)); } catch (e) {} };
const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach((t, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = [988, 784, 1175][i]; o.type = "triangle";
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.35);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.4);
    });
  } catch (e) {}
}
function renderClock() {
  $("digits").textContent = fmt(left);
  $("fill").style.transform = "scaleX(" + (total ? left / total : 0) + ")";
  $("digits").className = "digits" + (left <= 0 ? " done" : left <= 10 ? " warn" : "");
  $("go").textContent = running ? "Pause" : left <= 0 ? "Restart timer" : "Start timer";
}
function tick(now) {
  if (!running) return;
  left -= (now - last) / 1000; last = now;
  if (left <= 0) { left = 0; running = false; chime(); renderClock(); return; }
  renderClock(); raf = requestAnimationFrame(tick);
}
function stop() { running = false; cancelAnimationFrame(raf); }
function startTimer() { if (!shown) showQ(); if (left <= 0) left = total; running = true; last = performance.now(); raf = requestAnimationFrame(tick); renderClock(); }

function load() {
  stop();
  const R = ROUNDS[r], Q = R.qs[qi];
  shown = !R.wager; // wager round: question hidden until bets are written
  total = left = R.secs;
  $("rname").innerHTML = `<b>${R.tag}:</b> ${R.name}`;
  $("rule").textContent = R.rule;
  const main = R.qs.filter((q) => !q[3]).length;
  $("qnum").textContent = Q[3] ? "" : `Question ${qi + 1} / ${main}`;
  $("spare").textContent = Q[3] ? "Spare question" : "";
  $("q").textContent = shown ? Q[0] : "Teams: write your bet first (0–5).";
  $("q").classList.toggle("hide", !shown);
  $("show").hidden = shown;
  $("alab").textContent = R.secs === 90 ? "Example ideas" : "Answer";
  $("a").textContent = Q[1] === "Example ideas" ? "" : Q[1];
  $("why").textContent = Q[2];
  $("ans").classList.add("shut");
  $("prev").disabled = r === 0 && qi === 0;
  const more = R.qs.some((q, j) => j > qi && !q[3]);
  $("next").textContent = more ? "Next ▶" : "Next round ▶";
  $("next").disabled = !more && r + 1 >= ROUNDS.length;
  $("sparebtn").hidden = !R.qs.some((q) => q[3]);
  $("wagerhint").hidden = !R.wager;
  document.querySelectorAll("#rounds button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === r)));
  renderTeams(); renderClock();
}
function showQ() { shown = true; $("q").textContent = ROUNDS[r].qs[qi][0]; $("q").classList.remove("hide"); $("show").hidden = true; }

function renderTeams() {
  const max = Math.max(...state.pts), wager = !!ROUNDS[r].wager;
  $("teams").innerHTML = TEAMS.map(([_, c], i) => `
    <div class="team${state.pts[i] === max && max > 0 ? " lead" : ""}">
      <span class="dot" style="background:${c}"></span>
      <input class="name" id="name-${i}" aria-label="Team ${i + 1} name" value="${state.names[i].replace(/"/g, "&quot;")}">
      <span class="pts" id="pts-${i}">${state.pts[i]}</span>
      <div class="ctl">
        ${wager ? `<input type="number" min="0" max="5" id="bet-${i}" aria-label="Team ${i + 1} bet" value="${state.wager[i]}">
          <button data-t="${i}" data-act="win">✓ +bet</button><button data-t="${i}" data-act="lose">✗ −bet</button>`
        : `<button data-t="${i}" data-d="1">+1</button><button data-t="${i}" data-d="2">+2</button><button data-t="${i}" data-d="-1">−1</button>`}
      </div>
    </div>`).join("");
  document.querySelectorAll(".team input.name").forEach((el, i) => el.onchange = () => { state.names[i] = el.value.trim() || TEAMS[i][0]; persist(); });
  document.querySelectorAll(".team input[type=number]").forEach((el) => el.onchange = () => {
    const i = +el.id.split("-")[1]; let v = Math.round(+el.value || 0);
    v = Math.max(0, Math.min(5, Math.max(0, state.pts[i]), v)); el.value = v; state.wager[i] = v; persist();
  });
  document.querySelectorAll(".team .ctl button").forEach((b) => b.onclick = () => {
    const i = +b.dataset.t;
    if (b.dataset.d) state.pts[i] += +b.dataset.d;
    else { const bet = state.wager[i]; state.pts[i] += b.dataset.act === "win" ? bet : -bet; state.wager[i] = 0; }
    persist(); renderTeams();
  });
}

$("rounds").innerHTML = ROUNDS.map((R, i) => `<button id="round-${i}" data-r="${i}">${i + 1}. ${R.name}</button>`).join("");
document.querySelectorAll("#rounds button").forEach((b) => b.onclick = () => { r = +b.dataset.r; qi = 0; load(); });
$("show").onclick = showQ;
$("go").onclick = () => running ? (stop(), renderClock()) : startTimer();
$("reveal").onclick = () => { if (!shown) showQ(); stop(); renderClock(); $("ans").classList.remove("shut"); };
const nextMain = () => { const qs = ROUNDS[r].qs; for (let j = qi + 1; j < qs.length; j++) if (!qs[j][3]) return j; return -1; };
$("next").onclick = () => { const j = nextMain(); if (j >= 0) qi = j; else if (r + 1 < ROUNDS.length) { r++; qi = 0; } load(); };
$("sparebtn").onclick = () => { const qs = ROUNDS[r].qs, sp = qs.map((q, j) => q[3] ? j : -1).filter((j) => j >= 0); if (!sp.length) return; const k = sp.find((j) => j > qi); qi = k === undefined ? sp[0] : k; load(); };
$("prev").onclick = () => { if (qi > 0) qi--; else if (r > 0) { r--; qi = ROUNDS[r].qs.length - 1; } load(); };
let armed = false;
$("reset").onclick = () => {
  if (!armed) { armed = true; $("reset").textContent = "Click again to reset"; setTimeout(() => { armed = false; $("reset").textContent = "Reset scores"; }, 3000); return; }
  armed = false; $("reset").textContent = "Reset scores";
  state.pts = [0, 0, 0, 0, 0, 0]; state.wager = [0, 0, 0, 0, 0, 0]; persist(); renderTeams();
};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("go").click(); }
  else if (e.key === "a" || e.key === "A") $("reveal").click();
  else if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
});
load();
</script>
