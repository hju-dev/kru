<title>M.3 Talk Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Poppins:wght@500;700;800&display=swap">
<style>
/* Layout: one projector screen — phase label on top, giant digits centre, preset rail below. Single dark "scoreboard" look by choice. */
:root {
  --bg: #1F2024; --panel: #2B2C31; --line: #3B3D44; --fg: #F4F2EC; --muted: #9EA1AA;
  --yel: #FFB703; --teal: #2A9D8F; --coral: #FF6B6B; --warn: #FFB703; --stop: #FF5A5A;
  --display: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
.app { min-height: 100%; display: flex; flex-direction: column; gap: 18px;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.brand b { color: var(--yel); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 700 14px var(--body); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-radius: 24px; border: 3px solid var(--line);
  background: var(--panel); padding: 24px 16px; min-height: 52vh; transition: background .3s, border-color .3s; }
.phase { font-weight: 800; font-size: clamp(22px, 4.2vw, 46px); text-align: center; text-wrap: balance; }
.next { color: var(--muted); font-size: clamp(14px, 1.7vw, 20px); min-height: 1.4em; text-align: center; }
.digits { font-family: var(--display); font-weight: 500; font-size: clamp(96px, 22vw, 300px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { width: min(900px, 100%); height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--teal); transform-origin: left; transition: transform .25s linear, background .3s; }
.stage.warn { border-color: var(--warn); } .stage.warn .bar i { background: var(--warn); } .stage.warn .digits { color: var(--warn); }
.stage.done { border-color: var(--stop); background: #3A2224; } .stage.done .digits { color: var(--stop); animation: pulse 0.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .stage.done .digits { animation: none; } .bar i { transition: none; } }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button.ctl { font: 700 18px var(--body); border-radius: 14px; border: 3px solid var(--fg); background: transparent; color: var(--fg); padding: 10px 22px; cursor: pointer; min-width: 110px; }
button.ctl.primary { background: var(--yel); border-color: var(--yel); color: #1F2024; }
button:focus-visible { outline: 3px solid var(--yel); outline-offset: 3px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.preset { text-align: left; background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; cursor: pointer; font-family: var(--body); }
.preset[aria-pressed="true"] { border-color: var(--yel); }
.preset b { display: block; font-size: 15px; }
.preset span { color: var(--muted); font-size: 13px; font-family: var(--display); }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
</style>

<div class="app">
  <div class="top">
    <div class="brand"><b>M.3</b> Talk Timer</div>
    <div class="tabs" role="group" aria-label="Lesson">
      <button class="tab" id="tab-1" data-lesson="1">Lesson 1</button>
      <button class="tab" id="tab-2" data-lesson="2">Lesson 2</button>
      <button class="tab" id="tab-3" data-lesson="3">Lesson 3</button>
      <button class="tab" id="tab-4" data-lesson="4">Pitch (next week)</button>
    </div>
  </div>
  <section class="stage" id="stage" aria-live="polite">
    <div class="phase" id="phase">Pitch</div>
    <div class="digits" id="digits">3:00</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="next" id="next"></div>
  </section>
  <div class="controls">
    <button class="ctl primary" id="go">Start</button>
    <button class="ctl" id="reset">Reset</button>
    <button class="ctl" id="skip">Next phase</button>
    <button class="ctl" id="full">Full screen</button>
  </div>
  <div class="presets" id="presets"></div>
  <div class="hint">Space = start / pause · R = reset · N = next phase. A chime plays at zero.</div>
</div>

<script>
const LESSONS = {
  1: [
    { name: "20 Questions", phases: [["Play 20 Questions!", 900]] },
    { name: "One-word story round", phases: [["One-Word Story: one word each", 240]] },
    { name: "Story: fix it (R&W)", phases: [["Fix it: check the list", 240]] },
  ],
  2: [
    { name: "One-Word Duel", phases: [["One-Word Duel", 960]] },
    { name: "Duel clue (10 s)", phases: [["One clue: 10 seconds!", 10]] },
    { name: "Think Tank Showdown", phases: [["Think Tank Showdown", 960]] },
  ],
  3: [
    { name: "Speaking test", phases: [["Speaking test: talk!", 60], ["Change: next speaker", 10]] },
    { name: "Teacher model", phases: [["Teacher model", 60]] },
  ],
  4: [
    { name: "Final rehearsal", phases: [["Final rehearsal", 720]] },
    { name: "Pitch + Q&A", phases: [["Pitch", 180], ["Investor questions", 120]] },
    { name: "Invest credits", phases: [["Invest your credits", 300]] },
  ],
};
const $ = (id) => document.getElementById(id);
let lesson = 3, presetIdx = 1, phaseIdx = 0, total = 0, left = 0, running = false, last = 0, raf = 0, audio = null;

const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = [880, 660, 990][i]; o.type = "sine";
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.35);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.4);
    });
  } catch (e) {}
}
function preset() { return LESSONS[lesson][presetIdx]; }
function loadPhase(i) {
  phaseIdx = i; const [label, secs] = preset().phases[i];
  total = left = secs; $("phase").textContent = label;
  const nxt = preset().phases[i + 1];
  $("next").textContent = nxt ? "Then: " + nxt[0] + " (" + fmt(nxt[1]) + ")" : "";
  render();
}
function render() {
  $("digits").textContent = fmt(left);
  $("fill").style.transform = "scaleX(" + (total ? left / total : 0) + ")";
  const st = $("stage");
  st.classList.toggle("warn", left > 0 && left <= Math.min(30, total * 0.2));
  st.classList.toggle("done", left <= 0);
  $("go").textContent = running ? "Pause" : (left <= 0 ? "Restart" : "Start");
}
function tick(now) {
  if (!running) return;
  left -= (now - last) / 1000; last = now;
  if (left <= 0) {
    left = 0; chime();
    if (phaseIdx + 1 < preset().phases.length) { loadPhase(phaseIdx + 1); last = performance.now(); }
    else { running = false; render(); return; }
  }
  render(); raf = requestAnimationFrame(tick);
}
function start() { if (left <= 0) loadPhase(0); running = true; last = performance.now(); raf = requestAnimationFrame(tick); render(); }
function pause() { running = false; cancelAnimationFrame(raf); render(); }
function choose(l, p) {
  pause(); lesson = l; presetIdx = p;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-pressed", String(+t.dataset.lesson === l)));
  $("presets").innerHTML = LESSONS[l].map((pr, i) =>
    `<button class="preset" id="preset-${l}-${i}" aria-pressed="${i === p}" data-i="${i}"><b>${pr.name}</b><span>${pr.phases.map((ph) => fmt(ph[1])).join(" → ")}</span></button>`).join("");
  document.querySelectorAll(".preset").forEach((b) => b.onclick = () => choose(lesson, +b.dataset.i));
  loadPhase(0);
  try { localStorage.setItem("m3timer", JSON.stringify([l, p])); } catch (e) {}
}
$("go").onclick = () => running ? pause() : start();
$("reset").onclick = () => { pause(); loadPhase(0); };
$("skip").onclick = () => { const r = running; pause(); if (phaseIdx + 1 < preset().phases.length) loadPhase(phaseIdx + 1); else loadPhase(0); if (r) start(); };
$("full").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => choose(+t.dataset.lesson, 0));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); running ? pause() : start(); }
  else if (e.key === "r" || e.key === "R") $("reset").click();
  else if (e.key === "n" || e.key === "N") $("skip").click();
});
let saved = null; try { saved = JSON.parse(localStorage.getItem("m3timer")); } catch (e) {}
if (saved && LESSONS[saved[0]] && LESSONS[saved[0]][saved[1]]) choose(saved[0], saved[1]); else choose(3, 0);
</script>
